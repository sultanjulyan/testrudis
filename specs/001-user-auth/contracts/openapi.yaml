openapi: 3.0.0
info:
  title: Auth Service API
  version: 1.0.0
  description: Authentication service for Ticketing System
servers:
  - url: http://localhost:5000
    description: Local Development
paths:
  /api/users/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        201:
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        400:
          description: Validation error
        409:
          description: Email already in use

  /api/users/login:
    post:
      summary: Login user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          headers:
            Set-Cookie:
              schema:
                type: string
                description: HttpOnly access token
        400:
          description: Invalid credentials

  /api/users/me:
    get:
      summary: Get current authenticated user
      tags: [Auth]
      security:
        - cookieAuth: []
      responses:
        200:
          description: Current user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        401:
          description: Not authenticated

  /api/users/logout:
    post:
      summary: Logout user
      tags: [Auth]
      responses:
        200:
          description: Logged out successfully
          headers:
            Set-Cookie:
              schema:
                type: string
                description: Clears access token

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
  schemas:
    UserResponse:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        createdAt:
          type: string
          format: date-time
